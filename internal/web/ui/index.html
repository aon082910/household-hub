<!doctype html>
<html lang="en">
<head>

<link rel="manifest" href="manifest.webmanifest">

<body>
<div id="auth" class="auth hidden"></div>
<div id="app" class="hidden">

    <a href="#dashboard" data-view="dashboard"><span class="ic">&#8962;</span><span>Home</span></a>
    <a href="#calendar" data-view="calendar"><span class="ic">&#128197;</span><span>Calendar</span></a>
    <a href="#family" data-view="family"><span class="ic">&#128106;</span><span>Family</span></a>
    <a href="#bills" data-view="bills" class="fin"><span class="ic">&#129534;</span><span>Bills</span></a>
    <a href="#money" data-view="money" class="fin"><span class="ic">&#128176;</span><span>Money</span></a>
    <a href="#budget" data-view="budget" class="fin"><span class="ic">&#128202;</span><span>Budget</span></a>
    <a href="#plan" data-view="plan" class="fin"><span class="ic">&#128200;</span><span>Plan</span></a>

    <a href="#settings" data-view="settings"><span class="ic">&#9881;</span><span>Settings</span></a>
    <div class="who"><span id="whoName"></span><button class="link" data-action="logout">Sign out</button></div>
  </nav>
  <main id="main"></main>
</div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
<script src="plan.js"></script>
<script src="biz.js"></script>
